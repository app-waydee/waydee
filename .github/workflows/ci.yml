# Her push ve pull request'te backend testleri + frontend derlemesi.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      # Birim testleri. Uygulama bağlamı testi (WaydeeBackendApplicationTests)
      # PostgreSQL/PostGIS, Redis ve S3 ister; yerelde docker compose ile koşulur.
      - run: ./mvnw -B verify -Dtest='!WaydeeBackendApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    name: Frontend · tip kontrolü + derleme
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
