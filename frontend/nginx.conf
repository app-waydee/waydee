# WAYDEE — kullanıcı arayüzü sunucusu
#
# ${BACKEND_URL} açılışta envsubst ile doldurulur (Dockerfile'a bakın).
# `$uri`, `$host` gibi nginx değişkenleri ortam değişkeni OLMADIĞI için
# envsubst tarafından değiştirilmez — olduğu gibi kalır.

# ══════════════════════════════════════════════════════════════════════
# 🔴 ARAMA MOTORU / SOSYAL ÖNİZLEME YÖNLENDİRİCİSİ — 9 Ağustos 2026
#
# <b>Sorun:</b> uygulama tek sayfalık bir React uygulamasıdır; sunucudan
# gelen belge boş bir `<div id="root">`tur. Yani:
#   · WhatsApp / X / LinkedIn / Slack önizlemeleri JavaScript **hiç**
#     çalıştırmaz → paylaşılan her kullanıcı profili "WAYDEE · Dünyada
#     Yerini Al" başlıklı, kişiyle alakasız bir kart olarak görünüyordu;
#   · Google JS çalıştırır ama ikinci sırada ve bütçeyle; Bing çoğu zaman
#     hiç çalıştırmaz.
#
# <b>Çözüm (dynamic rendering):</b> yalnız **bot kullanıcı ajanları**
# backend'in ürettiği gerçek HTML'e yönlendirilir. Gerçek kullanıcı her
# zaman React uygulamasını alır.
#
# ⚠️ Bu **cloaking değildir**: bota gösterilen metin kullanıcının gördüğü
# metnin aynısıdır (ad, biyografi, gönderi ve ürün adları). Google'ın
# yasakladığı şey farklı İÇERİK göstermektir, aynı içeriği farklı biçimde
# sunmak değil.
#
# ⚠️ `map` **server bloğunun dışında** olmak zorundadır (http bağlamı);
# bu dosya `conf.d/default.conf` olarak açıldığı için burası doğru yer.
# ══════════════════════════════════════════════════════════════════════
map $http_user_agent $waydee_bot {
    default                          0;
    "~*googlebot"                    1;
    "~*bingbot"                      1;
    "~*yandex(bot|images)"           1;
    "~*duckduckbot"                  1;
    "~*baiduspider"                  1;
    "~*applebot"                     1;
    "~*facebookexternalhit"          1;
    "~*facebot"                      1;
    "~*twitterbot"                   1;
    "~*linkedinbot"                  1;
    "~*slackbot"                     1;
    "~*telegrambot"                  1;
    "~*whatsapp"                     1;
    "~*discordbot"                   1;
    "~*pinterest"                    1;
    "~*redditbot"                    1;
    "~*embedly"                      1;
    "~*quora link preview"           1;
    "~*skypeuripreview"              1;
    "~*vkshare"                      1;
    # Yapay zekâ tarayıcıları: ürünün adı bu yanıtlarda da geçmeli.
    "~*(gptbot|oai-searchbot|chatgpt-user)" 1;
    "~*(perplexitybot|claudebot|anthropic-ai|google-extended)" 1;
}

# Dosya uzantısı taşıyan adresler SAYFA DEĞİLDİR (favicon.svg, logo.png,
# manifest.json…). ⚠️ Bu ayrım şart: yoksa bot `/favicon.svg` istediğinde
# ona HTML dönerdi ve önizleme görselleri bozulurdu.
map $uri $waydee_page {
    default            1;
    "~*\.[a-z0-9]+$"   0;
}

# İki koşulun birleşimi — nginx'te `if` tek koşul alır, `&&` yoktur.
map "$waydee_bot:$waydee_page" $waydee_prerender {
    default   0;
    "1:1"     1;
}

# ══════════════════════════════════════════════════════════════════════
# 🔴 19 Ağu 2026 — HSTS + SÜRÜM İFŞASI (güvenlik incelemesi bulgusu)
#
# Canlıdan ölçüldü:
#   · `Server: nginx/1.27.5` → tam sürüm numarası açıktaydı. Saldırgan için
#     bu bir "hangi açıkları deneyeyim" listesidir; kapatmanın maliyeti sıfır.
#   · `Strict-Transport-Security` YOKTU → kullanıcının ilk (http) isteği
#     araya girilebilir bir pencere bırakıyordu (SSL stripping).
#
# ⚠️ TLS burada SONLANMIYOR — nginx :80 dinliyor, sertifika ALB'de. Bu yüzden
# HSTS'i koşulsuz basmak YANLIŞ olurdu: tarayıcıya yalnız HTTPS üzerinden
# gönderilmesi gerekir, yoksa standart gereği zaten yok sayılır ve düz HTTP
# konuşan sağlık kontrollerine gereksiz başlık ekler.
# Doğrusu ALB'nin ilettiği `X-Forwarded-Proto`ya bakmaktır.
#
# ⚠️ `preload` BİLİNÇLİ OLARAK YOK. Listeye girmek kolay, ÇIKMAK aylar sürer;
# alan adının tüm alt alanları sonsuza dek HTTPS'e mahkûm olur. Önce
# `max-age` bir süre yaşasın, sonra karar verilir.
# ══════════════════════════════════════════════════════════════════════
# 🔴 20 Ağu 2026 — ERİŞİM LOGUNDAN SAĞLIK KONTROLLERİ ELENDİ
#
# <b>Ölçüldü:</b> bu uygulamanın CloudWatch log grubu 30 günde **9,4 MB**
# ve örneklenen satırların neredeyse tamamı şuydu:
#   10.0.0.10 - - [...] "GET / HTTP/1.1" 200 2425 "-" "ELB-HealthChecker/2.0"
#
# ALB iki AZ'den 30 saniyede bir yokluyor → günde ~5.760 satır, hepsi aynı ve
# hiçbir soruyu cevaplamıyor. Sağlık kontrolünün sonucu zaten ECS'in kendi
# ölçümüdür; logda tekrarı saf gürültüdür ve GERÇEK trafiği görünmez kılar.
#
# ⚠️ Hata durumları YİNE loglanır: aşağıdaki `map` yalnız 2xx/3xx sağlık
# kontrolünü susturur. Sağlık kontrolü 5xx dönerse onu görmek İSTERİZ —
# zaten o an sorun var demektir.
map "$http_user_agent:$status" $waydee_loggable {
    default                        1;
    "~^ELB-HealthChecker.*:[23]"   0;
}

map $http_x_forwarded_proto $waydee_hsts {
    default "";
    "https" "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;

    # Sürüm numarasını gizler ("nginx/1.27.5" → "nginx").
    server_tokens off;

    # Sağlık kontrolleri hariç (bkz. `$waydee_loggable`).
    access_log /var/log/nginx/access.log combined if=$waydee_loggable;

    root /usr/share/nginx/html;

    # ══════════════════════════════════════════════════════════════════
    # 🔴 15 Ağu 2026 — `www` → KÖK ALAN (kanonik adres tek olmalı)
    #
    # 72. turda not düşülmüştü: *"`www` → kök yönlendirmesi HENÜZ EKLENMEDİ,
    # DNS gelmeden ölçülemez"*. DNS 11 Ağu'da düzeldi ama yönlendirme
    # eklenmeyi bekliyordu.
    #
    # <b>Ölçüldü (15 Ağu):</b> `https://www.waydee.com/` → **200** (yönlendirme
    # yok). Yani kök ve `www` **iki ayrı URL** olarak aynı içeriği veriyor —
    # klasik çift içerik. Google hangisini indeksleyeceğini kendi seçiyor ve
    # şikâyetteki sonuç da zaten **`www`**'li olan.
    #
    # `SeoService` canonical'ı zaten `https://waydee.com/` (köksüz) üretiyor →
    # kanonik adres **kök**. Yönlendirme de o yönde.
    #
    # ⚠️ `server_name _` her hostu yakaladığı için koşul şart: `app.waydee.com`
    # hâlâ ayakta (CORS listesinde) ve buradan etkilenmemeli.
    # ⚠️ `$request_uri` yolu **ve** sorgu dizesini birlikte taşır — ayrıca
    # `$is_args$args` eklemek parametreleri ÇİFTLERDİ.
    # ══════════════════════════════════════════════════════════════════
    if ($host = "www.waydee.com") {
        return 301 https://waydee.com$request_uri;
    }

    # ------------------------------------------------------------------
    # 🔴 GÜVENLİK BAŞLIKLARI — 8 Ağustos 2026 (güvenlik denetimi turu)
    #
    # <b>Bulgu:</b> backend `/api/**` yanıtlarına CSP, `X-Frame-Options` vb.
    # ekliyordu ama **HTML BELGESİNİN KENDİSİ çıplaktı**. Yani uygulama
    # herhangi bir sitede `<iframe>` içine alınabiliyordu → **clickjacking**:
    # saldırgan Waydee'yi görünmez bir çerçeveye koyup üstüne kendi düğmesini
    # bindirir, kullanıcı "bölge kirala" ya da "Pro'ya geç" düğmesine
    # farkında olmadan basar. API başlıkları bunu ENGELLEMEZ; çerçeveleme
    # kararı belgeyi sunan yanıtta verilir.
    #
    # ⚠️ `always` şart: `add_header` varsayılan olarak yalnız 2xx/3xx'e
    # eklenir; 404 ve 5xx sayfaları başlıksız kalırdı.
    # ------------------------------------------------------------------

    # 🔴 8 Ağustos 2026 — YAŞANMIŞ HATA: başlıklar üretimde HİÇ GÖRÜNMEDİ.
    #
    # Bunlar ilk denemede yalnız `server` bloğuna yazılmıştı. Dağıtıldı,
    # ölçüldü: `curl -I https://app.waydee.com/` → `Cache-Control: no-store`
    # **var**, güvenlik başlıklarının **hiçbiri yok**.
    #
    # <b>Sebep — nginx'in `add_header` kalıtımı:</b> bir `location` kendi
    # `add_header`'ını yazdığı anda ÜST BLOKTAN GELEN TÜM `add_header`'lar
    # düşer. `location /` ve `location /assets/` bloklarının ikisinde de
    # `Cache-Control` için `add_header` var → server seviyesindeki güvenlik
    # başlıkları sessizce yok sayıldı ve **clickjacking koruması hiç
    # devreye girmedi**.
    #
    # ⚠️ Çözüm: başlıklar `add_header` kullanan HER `location`'da TEKRAR
    # edilir. nginx'te "kalıtımı sürdür" diye bir seçenek yoktur; tekrar
    # gereksiz bir kopya değil, dilin gereğidir.
    # ⚠️ `always` şart: `add_header` varsayılan olarak yalnız 2xx/3xx'e ekler.
    #
    # 🔴 Ders: başlık eklemek "ekledim, oldu" işi değildir — `curl -I` ile
    # ÜRETİMDE ölçülmelidir.
    add_header Strict-Transport-Security  $waydee_hsts always;
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(self), camera=(self), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ⚠️ CSP <b>bilinçli olarak Report-Only</b> başlar.
    #
    # Uygulama üçüncü taraf kaynaklara gerçekten ihtiyaç duyuyor: Mapbox
    # (tile + worker + telemetri), Cloudflare Turnstile (script + iframe),
    # Google Fonts, gömülü kullanıcı siteleri (`frame-src` rastgele https),
    # tanıtım videosu. Zorlayıcı bir CSP'yi doğrulamadan açmak haritayı ya da
    # ziyaretçi kapısını üretimde kırardı — ve bu dosya yalnız üretim
    # imajında çalışıyor, yerelde Vite dev sunucusu var, yani burada
    # ölçülemez.
    #
    # 🔴 SIRADAKİ ADIM: birkaç gün rapor toplandıktan sonra bu satır
    # `Content-Security-Policy` olarak değiştirilmeli. Report-Only hiçbir şeyi
    # engellemez; koruma ancak zorlayıcı moda geçince başlar.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://api.mapbox.com blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.mapbox.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' data: blob: https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com https://challenges.cloudflare.com wss: ws:; frame-src https://challenges.cloudflare.com https:;" always;

    index index.html;

    # 🔴 15 Ağu 2026 — 25m → 70m (3B mağaza stüdyosundaki VİDEO yüklemesi).
    #
    # ⚠️ ÜÇ YERDE TUTARLI OLMALI ve en küçüğü gerçek sınırdır:
    #   ① burası (70m), ② `application.yml` → `multipart.max-file-size` (60MB),
    #   ③ `MediaService` → tür başına gerçek tavan (görsel 10, video 60, ses 15).
    #
    # Burası 25m kalsaydı 60 MB'lık video **nginx'ten** dönerdi: istek backend'e
    # hiç ulaşmaz, kullanıcı bizim anlaşılır mesajımızı değil ham bir **413**
    # görürdü. Üstelik bu yerelde ölçülemez — dev sunucusu Vite, bu dosya yalnız
    # üretim imajında çalışıyor.
    #
    # ⚠️ 70m (60 değil): çok parçalı gövde sınır dizeleri ve alan başlıkları
    # dosyanın kendisine ek yük bindirir; tam 60 yazmak tam 60 MB'lık bir
    # dosyayı sınırın hemen dışında bırakırdı.
    client_max_body_size 70m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API: aynı origin'den backend'e ----
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ülke tespiti CDN başlığından okunur; varsa aynen geçir.
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;
        proxy_read_timeout 60s;
    }

    # ---- WebSocket (STOMP) ----
    location /ws {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        # Uzun ömürlü bağlantı: varsayılan 60 sn'de kopardı.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    # ---- Statik varlıklar: içerik hash'li olduğu için uzun önbellek ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 🔴 TEKRAR ZORUNLU — bkz. dosya basindaki not: nginx'te bir
        # `location` kendi `add_header`'ini yazarsa ÜST BLOKTAN GELENLERİN
        # TAMAMINI düşürür. Bu blokta `Cache-Control` var, dolayısıyla
        # güvenlik başlıkları burada yeniden yazılmadan HTML'e HİÇ eklenmiyor.
        add_header Strict-Transport-Security  $waydee_hsts always;
    add_header X-Frame-Options            "DENY" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "geolocation=(self), camera=(self), microphone=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://api.mapbox.com blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.mapbox.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' data: blob: https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com https://challenges.cloudflare.com wss: ws:; frame-src https://challenges.cloudflare.com https:;" always;
    }

    # ---- SPA: bilinmeyen yollar index.html'e düşer (React Router) ----
    # ---- SEO: robots.txt ve site haritaları backend'den gelir ----
    # ⚠️ Bu adresler kökte durmak ZORUNDA: Google `example.com/robots.txt`
    # dışında hiçbir yere bakmaz. Backend'de ise `/api/v1/public/seo/**`
    # altındalar, çünkü güvenlik yapılandırmasında `permitAll` olan önek o.
    location = /robots.txt {
        proxy_pass ${BACKEND_URL}/api/v1/public/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/sitemap[a-z0-9-]*\.xml$ {
        proxy_pass ${BACKEND_URL}/api/v1/public/seo$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SEO: bot önizlemesi (yalnız `map` ile bot işaretlenen istekler) ----
    # `internal`: dışarıdan doğrudan çağrılamaz, yalnız aşağıdaki rewrite ile.
    location /__waydee_prerender {
        internal;
        proxy_pass ${BACKEND_URL}/api/v1/public/seo/render?path=$waydee_path;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        # ══════════════════════════════════════════════════════════════
        # 🔴 15 Ağu 2026 — KANONİKLEŞTİRME (Google `/index.html`i indeksledi)
        #
        # <b>Şikâyet:</b> "google'da waydee aratınca
        # https://www.waydee.com/index.html açılıyor ve hâlâ waitlist
        # sayfasına yönlendiriyor."
        #
        # <b>Ölçüldü (15 Ağu, curl):</b> sunucu **waitlist servis etmiyor** —
        # `/`, `/index.html` ve `www` üçü de **200** ve **aynı 1372 baytlık**
        # güncel SPA kabuğunu döndürüyor. DNS de temiz (13.62.186.69 /
        # 51.20.147.129 = AWS ALB); eski waitlist sunucusuyla (45.133.36.58)
        # bağ kalmamış. Yani gördüğün şey **Google'ın bayat indeksi**.
        #
        # <b>Onu ayakta tutan İKİ gerçek kusur:</b>
        #
        # ① `/index.html` **ayrı bir URL** olarak indekslenebiliyordu: `/` ile
        #    birebir aynı içeriği 200 ile veriyor ve kabukta `canonical`
        #    **yok**. Google için bunlar iki farklı sayfa.
        #
        # ② 🔴 Daha kötüsü: `/index.html` **bot ön-render'ını ATLIYOR**.
        #    Yukarıdaki `$waydee_page` map'i uzantılı adresleri "sayfa değil"
        #    sayar (`~*\.[a-z0-9]+$` → 0) ki bot `/favicon.svg` isteyince HTML
        #    almasın. Yan etkisi: Googlebot `/index.html`te ham SPA kabuğunu
        #    alıyor — başlığı ve açıklaması **eski iş modelini** anlatan
        #    ("Dünyada Yerini Al / bölgeni satın al") bayat metin. Arama
        #    sonucundaki yanlış içerik tam olarak buradan geliyordu.
        #
        # <b>Çözüm — kalıcı yönlendirme.</b> 301, Google'a "bu URL'yi düşür,
        # yerine kökü indeksle" der; `noindex` ya da yalnız `canonical`
        # sinyalinden **daha güçlü** ve daha hızlıdır.
        #
        # ⚠️ 🔴 KOŞUL `$request_uri` OLMAK ZORUNDA, `$uri` DEĞİL.
        # Aşağıdaki `try_files … /index.html` **iç yönlendirme** yapar ve iç
        # yönlendirme location eşleşmesini yeniden çalıştırır. `$uri` ile
        # koşsaydı SPA'nın HER rotası (`/about`, `/mustafa`, …) `/index.html`e
        # düşüp buradan 301 yerdi → **her sayfa köke yönlenir**, uygulama
        # tamamen kırılırdı. `$request_uri` ise **istemcinin yazdığı** adrestir
        # ve iç yönlendirmede değişmez; yani yalnız gerçekten dışarıdan
        # `/index.html` isteyen bir istemci yakalanır.
        # ⚠️ Sorgu dizesi korunur (`$is_args$args`) — kampanya parametreli
        # bağlantılar (`?utm_source=…`) yönlendirmede kaybolmamalı.
        # ══════════════════════════════════════════════════════════════
        if ($request_uri ~ "^/index\.html(\?|$)") {
            return 301 https://$host/$is_args$args;
        }

        # ⚠️ `if` burada iki güvenli kullanımdan biri: tek koşullu `rewrite`.
        # Bot değilse hiçbir şey olmaz ve akış `try_files`a devam eder.
        set $waydee_path $uri;
        if ($waydee_prerender) {
            rewrite ^ /__waydee_prerender last;
        }
        try_files $uri $uri/ /index.html;
        # 🔴 TEKRAR ZORUNLU — bkz. dosya basindaki not: nginx'te bir
        # `location` kendi `add_header`'ini yazarsa ÜST BLOKTAN GELENLERİN
        # TAMAMINI düşürür. Bu blokta `Cache-Control` var, dolayısıyla
        # güvenlik başlıkları burada yeniden yazılmadan HTML'e HİÇ eklenmiyor.
        add_header Strict-Transport-Security  $waydee_hsts always;
    add_header X-Frame-Options            "DENY" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "geolocation=(self), camera=(self), microphone=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://api.mapbox.com blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.mapbox.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' data: blob: https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com https://challenges.cloudflare.com wss: ws:; frame-src https://challenges.cloudflare.com https:;" always;
        # index.html ASLA önbelleğe alınmaz; yoksa yeni sürüm eski JS'i çağırır.
        add_header Cache-Control "no-store, must-revalidate";
    }
}
