name: waydee

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: waydee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 🔒 17 Ağu 2026 — YALNIZ LOOPBACK. Eskiden 0.0.0.0'a bağlanıyordu:
      # aynı ağdaki (kafe/ofis wifi) herkes veritabanına, Redis'e ve MinIO
      # konsoluna erişebiliyordu. Bunlar geliştirme servisleridir.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - waydee-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - waydee-net

  redis:
    image: redis:7-alpine
    container_name: waydee-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - waydee-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - waydee-net

  minio:
    image: minio/minio:latest
    container_name: waydee-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - waydee-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - waydee-net

volumes:
  waydee-postgres-data:
  waydee-redis-data:
  waydee-minio-data:

networks:
  waydee-net:
    name: waydee-net
    driver: bridge
