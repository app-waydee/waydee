# backend · Docker imajı → Amazon ECR → Amazon ECS (Fargate) yeniden dağıtım.
# Kimlik doğrulama GitHub OIDC ile yapılır: depoda AWS erişim anahtarı yoktur,
# yalnız üstlenilecek rolün ARN'si (AWS_ROLE_ARN) bir GitHub sırrıdır.
name: Deploy · backend

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: waydee-backend
  ECS_CLUSTER: waydee
  ECS_SERVICE: waydee-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: AWS rolünü üstlen (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR girişi
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: İmajı derle ve yükle
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            -t "$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}" \
            .
          docker push --all-tags "$REGISTRY/$ECR_REPOSITORY"

      - name: ECS servisini yeniden dağıt
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment --no-cli-pager
